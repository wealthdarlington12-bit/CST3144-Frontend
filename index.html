<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After School Activities</title>
     
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body>
   <h1>After School Activities</h1>

   <p>Discover and book after-school lesson</p>

   <h2>Explore our Lessons</h2>

   <div id="App">
     <p>{{ message }}</p>
     <label>Sort by:</label>
        <select v-model="sortBy">
            <option value="subject">Subject</option>
            <option value="location">Location</option>
            <option value="price">Price</option>
            <option value="spaces">Spaces</option>
            </select>

        <select v-model="sortOrder">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
        </select>

     <div v-for="lesson in sortedLessons">
         <h3>{{ lesson.subject }}</h3>
         <p>Location: {{ lesson.location }}</p>
         <p>Price: {{ lesson.price }}</p>
         <p>Spaces: {{ lesson.spaces }}</p>
     </div>  
   </div>
<script>
    new Vue({
        el : '#App',
        data: {
            message:'Welcome to After School Activities!',
            sortBy:'subject',
            sortOrder:'asc',
            lessons:[
                {
                subject:'Mathematics',
                location:'Room 1',
                price:50,
                spaces:5
            },
            {
                subject:'English',
                location:'Room 2',
                price:40,
                spaces:5
            },
            {
                subject:'Science',
                location:'Room 3',
                price:60,
                spaces:5
            },
            {
                subject:'History',
                location:'Room 4',
                price:45,
                spaces:5
            },
            {
                subject:'Art',
                location:'Room 5',
                price:30,
                spaces:5
            },
            {
                subject:'Music',
                location:'Room6',
                price:35,
                spaces:5
            },
            {
                subject:'Physical Education',
                location:'Room 7',
                price:55,
                spaces:5
            },
            {
                subject:'Computer Science',
                location:'Room8',
                price:70,
                spaces:5
            },
            {
                subject:'French',
                location:'Room 9',
                price:65,
                spaces:5
            },
            {
                subject:'Spanish',
                location:'Room 10',
                price:60,
                spaces:5
            },
        ]
        },
        computed:{
            sortedLessons() {
                return this.lessons.slice().sort((a, b) => {
                    if (this.sortOrder === 'asc') {
                        return a[this.sortBy] > b[this.sortBy] ? 1 : -1;
                    } else {
                        return a[this.sortBy] > b[this.sortBy] ? 1 : -1;
                    }
                });
            }
        }
    });
</script>

</body>
</html>
